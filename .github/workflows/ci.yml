# The CI gate (docs/spec/07-standards-and-verification.md, "CI"; ADR 0010).
# Two jobs: `check` runs the JavaScript toolchain, `database` runs the Supabase project.
# Actions are pinned to their current major tags (checked against GitHub on 2026-11-04).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The secret scan below reads the commits of this push or pull request, not just HEAD.
          fetch-depth: 0

      # Fails on anything that looks like a credential in the pushed or pull-request commits
      # (spec 07: secrets never in code or in git; a Firebase key once sat in app/lib/firebaseConfig.ts).
      # A user-owned repository needs no GITLEAKS_LICENSE. The example env files hold only blanks
      # and placeholders, and the tests build their sample JWTs at runtime, so no allowlist is needed.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No `version` input: the action reads `packageManager` from the root package.json.
      - uses: pnpm/action-setup@v6

      # `cache: pnpm` caches the pnpm store, keyed on pnpm-lock.yaml; pnpm must already be on PATH.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: Lint, typecheck and test every package
        run: pnpm turbo run lint typecheck test

      - name: Build the website against fixtures
        run: pnpm turbo run build --filter=@gog/web
        env:
          GOG_DATA_SOURCE: fixtures
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Build the partner app against fixtures
        run: pnpm turbo run build --filter=@gog/partner
        env:
          NEXT_PUBLIC_GOG_DATA_SOURCE: fixtures

      # The gate in apps/partner/next.config.ts throws while the config loads, before anything is
      # bundled (docs/spec/09-partner-app.md). Each of these two steps passes only when the build
      # fails with that rule's own message, so an unrelated failure cannot pass for the gate, and
      # prints the build's output when it fails for another reason.
      - name: Partner app refuses fixtures in production
        run: |
          if output="$(VERCEL_ENV=production NEXT_PUBLIC_GOG_DATA_SOURCE=fixtures pnpm --filter @gog/partner build 2>&1)"; then
            echo "$output"
            echo "::error::the partner build accepted fixtures on the production deployment"
            exit 1
          fi
          if ! grep -F 'NEXT_PUBLIC_GOG_DATA_SOURCE=fixtures is refused on the production deployment' <<<"$output"; then
            echo "$output"
            echo "::error::the partner build failed, but not because of the fixtures rule"
            exit 1
          fi

      # sb_secret_probe is not a key: it only has the prefix the gate refuses.
      - name: Partner app refuses a secret key
        run: |
          if output="$(NEXT_PUBLIC_GOG_DATA_SOURCE=supabase NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_secret_probe pnpm --filter @gog/partner build 2>&1)"; then
            echo "$output"
            echo "::error::the partner build accepted an sb_secret_ key"
            exit 1
          fi
          if ! grep -F 'NEXT_PUBLIC_SUPABASE_ANON_KEY holds an sb_secret_ key' <<<"$output"; then
            echo "$output"
            echo "::error::the partner build failed, but not because of the key rule"
            exit 1
          fi

      # Every rule of the gate, refused and accepted cases alike, through `next typegen` (seconds):
      # the key rule in each form (sb_secret_, JWT roles, an unreadable token, a quoted or prefixed
      # paste), the data-source and URL rules, the Vercel presence rules, and valid configurations
      # that must still load.
      - name: Partner app's build gate, case by case
        run: pnpm --filter @gog/partner check:gate

      - name: expo-doctor
        # Required. It may only fail when the network it depends on is unreachable from the runner.
        # EXPO_OFFLINE makes its dependency check compare the installed packages with the map that
        # ships in the installed `expo` (expo/bundledNativeModules.json) instead of Expo's latest
        # patches, so the same lockfile gets the same answer every day. Newer patches are reported
        # by the weekly expo-sdk-patches workflow instead of failing every pull request.
        env:
          EXPO_OFFLINE: '1'
        run: |
          if pnpm --filter @gog/player exec expo-doctor; then
            exit 0
          fi
          if curl --silent --show-error --fail --max-time 15 --output /dev/null https://api.expo.dev/v2/versions/latest &&
            curl --silent --show-error --fail --max-time 15 --output /dev/null https://registry.npmjs.org/expo/latest; then
            echo "::error::expo-doctor failed while the network was reachable"
            exit 1
          fi
          echo "::warning::expo-doctor failed while api.expo.dev or registry.npmjs.org was unreachable; not counted as a failure"

  database:
    name: Migrations, pgTAP, generated types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pinned, never `latest`: Supabase CLI v3 (2026-11-02) changes the default target and the
      # `--local`/`--db-url` flags. The same version is named in README.md; upgrade both together.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      # Starts Postgres (applying supabase/migrations and supabase/seed.sql on its fresh volume)
      # plus Kong, PostgREST and GoTrue, which the @gog/data contract tests talk to below. The
      # services nothing here needs are skipped to keep the job short.
      - name: Start the local stack, apply migrations and seed
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,mailpit

      - name: Run the pgTAP tests
        run: supabase test db

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `db:types` regenerates the file in place and formats it with the repository's Prettier, so
      # only a real schema difference fails here, not the Prettier inside the generator's image.
      - name: Generated database types are current
        run: |
          pnpm db:types
          git diff --exit-code -- packages/data/src/database.types.ts

      # The Supabase repositories through the real PostgREST and GoTrue (spec 07, definition of done
      # item 2). Without these two variables the suites skip, so this is the only place they run.
      # A skipped suite still exits 0, so the step also requires passing tests in both Supabase files.
      - name: Contract tests for the Supabase repositories
        run: |
          supabase status -o env \
            --override-name api.url=GOG_TEST_SUPABASE_URL \
            --override-name auth.anon_key=GOG_TEST_SUPABASE_ANON_KEY |
            grep -E '^GOG_TEST_SUPABASE_(URL|ANON_KEY)=' > /tmp/supabase.env
          set -a
          . /tmp/supabase.env
          set +a
          pnpm --filter @gog/data test --reporter=default --reporter=json --outputFile.json=/tmp/vitest.json
          for suite in booking/supabase-booking catalog/supabase-catalog; do
            jq -e --arg suite "src/$suite.test.ts" \
              '[.testResults[] | select(.name | endswith($suite)) | .assertionResults[] | select(.status == "passed")] | length > 0' \
              /tmp/vitest.json > /dev/null || { echo "::error::$suite ran no tests"; exit 1; }
          done
